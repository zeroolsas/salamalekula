<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Библиотека</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input,
        select {
            padding: 10px;
            font-size: 16px;
        }

        input {
            flex: 1;
        }

        .book {
            background: white;
            padding: 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .book h2 {
            margin-top: 0;
        }

        .author {
            color: #555;
        }

        .year {
            color: #888;
        }
    </style>
</head>

<body>

    <h1>📚 Библиотека</h1>

    <div class="controls">
        <input
            type="text"
            id="search"
            placeholder="Поиск книги или автора..."
        >

        <select id="sort">
            <option value="title">По названию</option>
            <option value="author">По автору</option>
            <option value="year">По году</option>
        </select>
    </div>

    <div id="books">
        Загрузка...
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "ВСТАВЬ_СЮДА_URL";
        const SUPABASE_KEY = "ВСТАВЬ_СЮДА_PUBLIC_KEY";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        let allBooks = [];

        async function loadBooks() {
            const { data, error } = await supabaseClient
                .from("books")
                .select(`
                    id,
                    title,
                    year,
                    author_id,
                    authors (
                        id,
                        name
                    )
                `);

            if (error) {
                console.error(error);

                document.getElementById("books").innerHTML =
                    "<p>Ошибка загрузки данных.</p>";

                return;
            }

            allBooks = data;

            renderBooks();
        }

        function renderBooks() {
            const searchText =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();

            const sortType =
                document.getElementById("sort").value;

            let filteredBooks = allBooks.filter(book => {
                const title = book.title.toLowerCase();
                const author = book.authors.name.toLowerCase();

                return (
                    title.includes(searchText) ||
                    author.includes(searchText)
                );
            });

            filteredBooks.sort((a, b) => {
                if (sortType === "title") {
                    return a.title.localeCompare(b.title);
                }

                if (sortType === "author") {
                    return a.authors.name.localeCompare(
                        b.authors.name
                    );
                }

                if (sortType === "year") {
                    return a.year - b.year;
                }
            });

            const container =
                document.getElementById("books");

            if (filteredBooks.length === 0) {
                container.innerHTML =
                    "<p>Ничего не найдено.</p>";

                return;
            }

            container.innerHTML =
                filteredBooks.map(book => `
                    <div class="book">
                        <h2>${book.title}</h2>

                        <div class="author">
                            Автор: ${book.authors.name}
                        </div>

                        <div class="year">
                            Год: ${book.year}
                        </div>
                    </div>
                `).join("");
        }

        document
            .getElementById("search")
            .addEventListener("input", renderBooks);

        document
            .getElementById("sort")
            .addEventListener("change", renderBooks);

        loadBooks();
    </script>

</body>
</html>
